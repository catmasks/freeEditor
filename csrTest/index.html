<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeEditor · 富文本编辑器</title>
    <meta
      name="description"
      content="FreeEditor 基于 TipTap 的轻量级富文本编辑器，开箱即用，内置中英日三语"
    />
  </head>
  <body>
    <div id="app" class="dark">
      <!-- 顶栏 -->
      <header class="topbar">
        <div class="brand">
          <img src="../src/assets/logo.png" alt="FreeEditor" />
          FreeEditor
        </div>
        <div class="top-actions">
          <button class="theme-toggle" id="theme-toggle">切换主题</button>
          <button class="theme-toggle" id="get-html-btn">获取 HTML</button>
          <button class="theme-toggle" id="get-json-btn">获取 JSON</button>
          <button class="theme-toggle" id="get-character-count-btn">
            获取字符数
          </button>
          <button class="theme-toggle" id="get-text-content-btn">
            获取文本
          </button>
          <button class="theme-toggle" id="get-selected-text-btn">
            获取选中文本
          </button>
          <button class="theme-toggle" id="focus-btn">聚焦</button>
          <button class="theme-toggle" id="blur-btn">失焦</button>
          <button class="theme-toggle" id="destroy-editor-btn">
            销毁编辑器
          </button>
        </div>
      </header>

      <!-- 主体 -->
      <div class="workspace">
        <div class="main-col">
          <section class="panel editor-panel">
            <div class="panel-head">
              <h3>✍️ 编辑器</h3>
            </div>
            <div class="editor-body">
              <div id="editor-container"></div>
            </div>
          </section>
        </div>

        <div class="bottom-row">
          <section class="panel">
            <div class="panel-head">
              <h3>🎛️ 编辑状态</h3>
              <span class="hint">测试 disabled / readonly</span>
            </div>
            <div class="statebar">
              <button class="theme-toggle" id="toggle-disabled">
                切换禁用
              </button>
              <button class="theme-toggle" id="toggle-readonly">
                切换只读
              </button>
              <span id="editor-state-label"></span>
            </div>
            <div id="preview" class="preview"></div>
          </section>

          <!-- 国际化 -->
          <section class="panel">
            <div class="panel-head">
              <h3>🌐 国际化（i18n）</h3>
              <span class="hint">切换语言实时更新翻译</span>
            </div>
            <div class="lang-actions">
              <button
                class="theme-toggle locale-btn active"
                data-locale="zh-CN"
              >
                中文
              </button>
              <button class="theme-toggle locale-btn" data-locale="en">
                English
              </button>
              <button class="theme-toggle locale-btn" data-locale="ja-JP">
                日本語
              </button>
              <div class="divider"></div>
              <button class="theme-toggle" id="extend-i18n-btn">
                自定义文案
              </button>
            </div>

            <div class="collect">
              <p>
                <strong id="current-locale-label">当前语言：</strong
                ><span id="current-locale">zh-CN</span>
              </p>
              <p>
                <strong id="bold-label">粗体按钮 tooltip：</strong
                ><code id="demo-bold">toolbar.bold</code>
              </p>
              <p>
                <strong id="italic-label">斜体按钮 tooltip：</strong
                ><code id="demo-italic">toolbar.italic</code>
              </p>
              <p>
                <strong id="placeholder-label">占位符文本：</strong
                ><code id="demo-placeholder">common.placeholder</code>
              </p>
              <p>
                <strong id="confirm-label">确认按钮：</strong
                ><code id="demo-confirm">common.confirm</code>
              </p>
              <p>
                <strong id="cancel-label">取消按钮：</strong
                ><code id="demo-cancel">common.cancel</code>
              </p>
              <p>
                <strong id="heading-label">标题下拉：</strong
                ><code id="demo-heading-body">heading.body</code>
              </p>
            </div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
